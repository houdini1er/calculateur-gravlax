name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Copier la page dans l'application
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Compiler l'APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -Pvc=${{ github.run_number }}

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calculateur-gravlax.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calculateur-gravlax-apk
          path: calculateur-gravlax.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Calculateur Gravlax 1.${{ github.run_number }}
          body: APK Android du calculateur (FR / EN). Télécharger calculateur-gravlax.apk et l'ouvrir sur le téléphone.
          files: calculateur-gravlax.apk
          make_latest: true

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Calculateur Gravlax</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: une colonne étroite façon fiche de poissonnier : saisie en haut, résultats en grand, planning en bas */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --fg: #12262b;
  --muted: #5a6f72;
  --line: #d3dedc;
  --accent: #d9553a;
  --accent-fg: #ffffff;
  --sea: #1d5560;
  --sea-soft: #e0edec;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1d; --surface: #152428; --fg: #e8f0ef; --muted: #8fa5a8; --line: #26393d;
    --accent: #ff7a5c; --accent-fg: #1a0d09; --sea: #7cc4cf; --sea-soft: #1a3238;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1d; --surface: #152428; --fg: #e8f0ef; --muted: #8fa5a8; --line: #26393d;
  --accent: #ff7a5c; --accent-fg: #1a0d09; --sea: #7cc4cf; --sea-soft: #1a3238;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 620px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-family: var(--font-display); font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.05; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
label, .lbl { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 6px; }
.weight-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.num { display: flex; align-items: baseline; gap: 6px; }
input[type=number], input[type=datetime-local] {
  font-family: var(--font-mono); font-size: 1.2rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0;
}
input[type=number] { width: 7.5ch; }
input[type=datetime-local] { width: 100%; font-size: 1rem; }
.unit { color: var(--muted); font-family: var(--font-mono); }
input[type=range] { flex: 1 1 160px; min-width: 0; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button {
  font: inherit; font-weight: 600; padding: 10px 6px; border-radius: 8px; cursor: pointer;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line);
}
.seg button small { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.seg button[aria-pressed="true"] { background: var(--sea); color: var(--bg); border-color: var(--sea); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.seg.two-seg { grid-template-columns: 1fr 1fr; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.big { background: var(--sea-soft); border-radius: 10px; padding: 14px 12px; min-width: 0; }
.big .v { font-family: var(--font-mono); font-size: clamp(1.4rem, 6.5vw, 2rem); font-weight: 500; line-height: 1.1; }
.big .v span { font-size: 0.9rem; color: var(--muted); margin-left: 2px; }
.big.hot { background: var(--accent); color: var(--accent-fg); }
.big.hot .lbl, .big.hot .v span { color: inherit; opacity: 0.85; }
.big .lbl { margin-bottom: 4px; font-size: 0.7rem; }
.hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
td:last-child { text-align: right; font-family: var(--font-mono); font-size: 0.9rem; }
.tablewrap { overflow-x: auto; }
h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; }
ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.warn { border-left: 3px solid var(--accent); padding-left: 12px; }
@media (max-width: 420px) { .results { grid-template-columns: 1fr 1fr; } .big.hot { grid-column: 1 / -1; } }
</style>

<main>
  <header>
    <h1>Calculateur Gravlax</h1>
    <p class="sub">Sel, sucre et temps de salage sous vide selon le produit et son poids.</p>
  </header>

  <section class="panel" aria-label="Paramètres">
    <div>
      <span class="lbl">Produit</span>
      <div class="seg two-seg" id="prod">
        <button type="button" data-prod="saumon" aria-pressed="true">Saumon<small>gravlax</small></button>
        <button type="button" data-prod="magret" aria-pressed="false">Magret de canard<small>salé puis séché</small></button>
        <button type="button" data-prod="filet" aria-pressed="false">Filet mignon de porc<small>salé puis séché</small></button>
        <button type="button" data-prod="poitrine" aria-pressed="false">Poitrine de porc<small>salée puis séchée</small></button>
      </div>
    </div>

    <div>
      <label for="w" id="wLbl">Poids du filet</label>
      <div class="weight-row">
        <div class="num"><input id="w" type="number" inputmode="numeric" min="200" max="4000" step="10" value="1000"><span class="unit">g</span></div>
        <input id="wr" type="range" min="200" max="3000" step="50" value="1000" aria-label="Poids en grammes">
      </div>
    </div>

    <div>
      <span class="lbl">Texture souhaitée</span>
      <div class="seg" id="seg">
        <button type="button" data-p="doux" aria-pressed="false">Doux<small>3 % / 3 %</small></button>
        <button type="button" data-p="classique" aria-pressed="true">Classique<small>5 % / 5 %</small></button>
        <button type="button" data-p="ferme" aria-pressed="false">Ferme<small>6 % / 4 %</small></button>
      </div>
    </div>

    <div class="two">
      <div><label for="ps" id="psL">Sel (% du poids)</label><div class="num"><input id="ps" type="number" min="1" max="10" step="0.5" value="5"><span class="unit">%</span></div></div>
      <div><label for="pu">Sucre (% du poids)</label><div class="num"><input id="pu" type="number" min="0" max="10" step="0.5" value="5"><span class="unit">%</span></div></div>
    </div>

    <div>
      <label for="start">Début du salage</label>
      <input id="start" type="datetime-local">
    </div>
  </section>

  <section class="results" aria-live="polite" aria-label="Résultats">
    <div class="big"><div class="lbl" id="rSelL">Sel fin</div><div class="v"><b id="rSel">50</b><span>g</span></div></div>
    <div class="big"><div class="lbl">Sucre semoule</div><div class="v"><b id="rSucre">50</b><span>g</span></div></div>
    <div class="big hot"><div class="lbl">Temps de salage</div><div class="v"><b id="rH">36</b><span>h</span></div></div>
  </section>

  <section class="panel">
    <h2>Planning</h2>
    <div class="tablewrap"><table id="plan"></table></div>
    <p class="hint" id="dur"></p>
  </section>

  <section class="panel">
    <h2>Pour aromatiser</h2>
    <p class="hint" id="saltHint"></p>
    <div class="tablewrap"><table id="arom"></table></div>
  </section>

  <section class="panel">
    <h2>Méthode</h2>
    <ol id="steps"></ol>
    <p class="hint warn" id="warn"></p>
  </section>
</main>

<script>
(function () {
  var HIDE = "Sel : sel fin de mer, non iodé et sans anti-agglomérant. Sucre : sucre semoule blanc ; la cassonade ou le sucre roux donnent un goût plus caramélisé. Les quantités sont des poids.";
  var PORK_HINT = "Sel nitrité obligatoire : pour une charcuterie crue à sécher, prenez un sel nitrité (sel de cure) à la place du sel fin, et suivez la notice du fabricant sans dépasser sa dose maximale. Sucre : sucre semoule blanc ou cassonade. Les quantités sont des poids.";
  var PORK_WARN = "Porc cru séché : le sous vide sans nitrite favorise le botulisme, d'où le sel nitrité. Si vous le mangez cru, congelez d'abord la viande 3 semaines à −18 °C (risque de trichine). Si la viande devient molle, visqueuse ou sent mauvais, jetez-la. Pour un petit salé qui se cuit, gardez seulement le salage, ignorez le séchage et cuisez à cœur (70 °C minimum). Les durées sont indicatives : une pièce épaisse demande plus de temps.";

  function fr(n) { return String(Math.round(n * 10) / 10).replace(".", ","); }
  function gr(n) { return Math.round(n) + " g"; }

  /* prof : [sel %, sucre %, coefficient de temps, jours de séchage]
     time : [heures fixes, heures par kg] pour un salage à sec ; le sous vide retire 20 % */
  var PR = {
    saumon: {
      wLbl: "Poids du filet", def: 1000, dry: false, loss: 0, time: [12, 24], min: 10, max: 80,
      prof: { doux: [3, 3, 0.8, 0], classique: [5, 5, 1, 0], ferme: [6, 4, 1.2, 0] },
      selLbl: "Sel fin", hint: HIDE,
      arom: function (kg) { return [
        ["Aneth frais", gr(kg * 50)],
        ["Poivre concassé", fr(kg * 2) + " g (≈ " + Math.max(1, Math.round(kg)) + " c. à café)"],
        ["Alcool (aquavit, cognac, gin), facultatif", Math.round(kg * 15) + " ml"]
      ]; },
      steps: [
        "Mélangez sel et sucre, avec l'aneth et le poivre.",
        "Frottez la chair du filet avec le mélange, puis glissez-le dans un sac sous vide (un filet par sac, ou deux filets chair contre chair).",
        "Mettez sous vide et placez au réfrigérateur (0 à 4 °C) pour la durée indiquée.",
        "Pas besoin de retourner : massez simplement le sac une fois ou deux pour répartir la saumure.",
        "Rincez rapidement, séchez, puis tranchez finement en biais."
      ],
      warn: "Le poisson se mange cru : choisissez un saumon extra-frais prévu pour cela, ou congelé 24 h à −20 °C minimum avant le salage. Gardez le gravlax au froid et mangez-le sous 5 jours. Les durées sont indicatives : un filet épais ou une chair très ferme demande plus de temps."
    },
    magret: {
      wLbl: "Poids du magret", def: 400, dry: true, loss: 30, time: [6, 14], min: 5, max: 40,
      prof: { doux: [2.5, 0.5, 0.8, 5], classique: [3, 1, 1, 7], ferme: [4, 1, 1.2, 10] },
      selLbl: "Sel fin", hint: HIDE,
      arom: function (kg) { return [
        ["Thym ou herbes de Provence", gr(kg * 5)],
        ["Poivre concassé", fr(kg * 5) + " g"]
      ]; },
      steps: [
        "Retirez la peau si vous voulez, sinon quadrillez le gras sans entamer la chair. Mélangez sel, sucre, poivre et thym.",
        "Enrobez le magret du mélange, mettez-le sous vide dans un sac et placez-le au réfrigérateur (0 à 4 °C) pour la durée de salage indiquée. Massez le sac une fois ou deux.",
        "Rincez, séchez soigneusement, puis enveloppez dans un linge propre ou une étamine.",
        "Laissez sécher au frais (réfrigérateur ou cave à 10-14 °C) jusqu'à la perte de poids indiquée. Pesez-le tous les jours ou presque.",
        "Tranchez très finement. Se conserve ensuite 2 à 3 semaines au réfrigérateur, filmé."
      ],
      warn: "Choisissez un magret très frais, avec une odeur neutre, et gardez-le toujours au froid pendant le séchage. Si le magret reste mou après la durée indiquée, ou s'il sent mauvais, jetez-le. Les durées sont indicatives : un magret épais demande plus de temps."
    },
    filet: {
      wLbl: "Poids du filet mignon", def: 400, dry: true, loss: 35, time: [14, 24], min: 10, max: 72,
      prof: { doux: [2.5, 0.5, 0.8, 8], classique: [3, 0.5, 1, 12], ferme: [3.5, 0.5, 1.2, 16] },
      selLbl: "Sel nitrité", hint: PORK_HINT,
      arom: function (kg) { return [
        ["Thym, laurier, baies de genévrier (mélange)", gr(kg * 5)],
        ["Poivre concassé", fr(kg * 5) + " g"],
        ["Ail haché, facultatif", Math.max(1, Math.round(kg * 2)) + " gousse(s)"]
      ]; },
      steps: [
        "Parez le filet : retirez la membrane argentée pour que le sel pénètre. Mélangez le sel nitrité, le sucre, les herbes, le poivre et l'ail.",
        "Enrobez le filet du mélange, mettez-le sous vide dans un sac et placez-le au réfrigérateur (0 à 4 °C) pour la durée de salage indiquée. Massez le sac une fois ou deux.",
        "Rincez, séchez soigneusement, puis enveloppez dans un linge propre ou une étamine et ficelez.",
        "Laissez sécher au frais (réfrigérateur ou cave à 10-14 °C) jusqu'à la perte de poids indiquée. Pesez-le tous les 2 jours.",
        "Tranchez très finement. Se conserve ensuite 2 à 3 semaines au réfrigérateur, filmé."
      ],
      warn: PORK_WARN
    },
    poitrine: {
      wLbl: "Poids de la poitrine", def: 1000, dry: true, loss: 30, time: [72, 48], min: 48, max: 192,
      prof: { doux: [2.5, 0.5, 0.8, 14], classique: [3, 1, 1, 21], ferme: [3.5, 1, 1.2, 28] },
      selLbl: "Sel nitrité", hint: PORK_HINT,
      arom: function (kg) { return [
        ["Thym, laurier, baies de genévrier (mélange)", gr(kg * 5)],
        ["Poivre concassé", fr(kg * 5) + " g"],
        ["Ail haché, facultatif", Math.max(1, Math.round(kg * 2)) + " gousse(s)"]
      ]; },
      steps: [
        "Gardez la couenne ou retirez-la. Mélangez le sel nitrité, le sucre, les herbes, le poivre et l'ail.",
        "Frottez la poitrine sur toutes les faces, mettez-la sous vide dans un sac et placez-la au réfrigérateur (0 à 4 °C) pour la durée de salage indiquée. Massez le sac une fois par jour.",
        "Rincez, séchez soigneusement. Laissez à plat ou roulez la poitrine serrée, chair à l'intérieur, et ficelez. Enveloppez dans un linge propre ou une étamine.",
        "Laissez sécher au frais (réfrigérateur ou cave à 10-14 °C) jusqu'à la perte de poids indiquée. Pesez-la tous les 2 à 3 jours.",
        "Tranchez très finement, ou taillez en lardons à cuire. Se conserve ensuite 3 semaines au réfrigérateur, filmée."
      ],
      warn: PORK_WARN
    }
  };

  var product = "saumon";
  var P = PR.saumon;
  var profile = "classique";
  var $ = function (id) { return document.getElementById(id); };
  var w = $("w"), wr = $("wr"), ps = $("ps"), pu = $("pu"), st = $("start");

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function toLocalInput(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  var now = new Date(); now.setHours(now.getHours() + 1, 0, 0, 0);
  st.value = toLocalInput(now);

  function fmtDate(d) {
    return d.toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function fmtDur(h) {
    var j = Math.floor(h / 24), r = h % 24;
    if (j === 0) return h + " h";
    return j + " j" + (r ? " " + r + " h" : "");
  }

  function renderStatic() {
    $("wLbl").textContent = P.wLbl;
    $("rSelL").textContent = P.selLbl;
    $("psL").textContent = P.selLbl === "Sel nitrité" ? "Sel nitrité (% du poids)" : "Sel (% du poids)";
    $("saltHint").textContent = P.hint;
    $("warn").textContent = P.warn;
    $("steps").innerHTML = P.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("");
    document.querySelectorAll("#seg button").forEach(function (x) {
      var p = P.prof[x.getAttribute("data-p")];
      x.querySelector("small").textContent = fr(p[0]) + " % / " + fr(p[1]) + " %";
    });
  }

  function calc() {
    var grams = parseFloat(w.value);
    if (!(grams > 0)) return;
    var kg = grams / 1000;
    var salt = grams * (parseFloat(ps.value) || 0) / 100;
    var sugar = grams * (parseFloat(pu.value) || 0) / 100;
    var pf = P.prof[profile];
    /* sous vide : environ 20 % de temps en moins qu'un salage à sec classique */
    var hours = Math.round((P.time[0] + P.time[1] * kg) * pf[2] * 0.8);
    hours = Math.max(P.min, Math.min(P.max, hours));
    var dry = pf[3];

    $("rSel").textContent = Math.round(salt);
    $("rSucre").textContent = Math.round(sugar);
    $("rH").textContent = hours;

    var start = new Date(st.value);
    var rows = "";
    if (!isNaN(start)) {
      rows += "<tr><td>Mise sous vide et au frais</td><td>" + fmtDate(start) + "</td></tr>";
      var endSalt = new Date(start.getTime() + hours * 3600000);
      if (P.dry) {
        rows += "<tr><td><b>Rincer, sécher, emballer dans un linge</b></td><td><b>" + fmtDate(endSalt) + "</b></td></tr>";
        rows += "<tr><td><b>Fin du séchage (" + dry + " j)</b></td><td><b>" + fmtDate(new Date(endSalt.getTime() + dry * 86400000)) + "</b></td></tr>";
      } else {
        rows += "<tr><td><b>Rincer, sécher, trancher</b></td><td><b>" + fmtDate(endSalt) + "</b></td></tr>";
      }
    }
    $("plan").innerHTML = rows;
    $("dur").textContent = P.dry
      ? "Salage " + fmtDur(hours) + ", puis séchage " + dry + " j environ, jusqu'à ≈ " + Math.round(grams * (1 - P.loss / 100)) + " g (perte de " + P.loss + " % du poids de départ : " + grams + " g)."
      : "Durée totale : " + fmtDur(hours) + " pour " + grams + " g.";

    $("arom").innerHTML = P.arom(kg).map(function (r) {
      return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>";
    }).join("");
  }

  function syncWeight(v, from) {
    if (from !== "n") w.value = v;
    if (from !== "r") wr.value = Math.min(3000, Math.max(200, v));
    calc();
  }
  w.addEventListener("input", function () { var v = parseFloat(w.value); if (v > 0) syncWeight(v, "n"); });
  wr.addEventListener("input", function () { syncWeight(parseFloat(wr.value), "r"); });
  [ps, pu, st].forEach(function (el) { el.addEventListener("input", calc); });

  $("seg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    profile = b.getAttribute("data-p");
    document.querySelectorAll("#seg button").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    ps.value = P.prof[profile][0];
    pu.value = P.prof[profile][1];
    calc();
  });

  $("prod").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    product = b.getAttribute("data-prod");
    P = PR[product];
    document.querySelectorAll("#prod button").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    renderStatic();
    ps.value = P.prof[profile][0];
    pu.value = P.prof[profile][1];
    syncWeight(P.def);
  });

  renderStatic();
  calc();
})();
</script>

</body></html>

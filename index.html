<title>Calculateur Gravlax</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: une colonne étroite façon fiche de poissonnier : saisie en haut, résultats en grand, planning en bas */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --fg: #12262b;
  --muted: #5a6f72;
  --line: #d3dedc;
  --accent: #d9553a;
  --accent-fg: #ffffff;
  --sea: #1d5560;
  --sea-soft: #e0edec;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1d; --surface: #152428; --fg: #e8f0ef; --muted: #8fa5a8; --line: #26393d;
    --accent: #ff7a5c; --accent-fg: #1a0d09; --sea: #7cc4cf; --sea-soft: #1a3238;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1d; --surface: #152428; --fg: #e8f0ef; --muted: #8fa5a8; --line: #26393d;
  --accent: #ff7a5c; --accent-fg: #1a0d09; --sea: #7cc4cf; --sea-soft: #1a3238;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 620px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h1 { font-family: var(--font-display); font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.05; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }
.lang { display: flex; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button {
  font: 600 0.8rem var(--font-body); letter-spacing: 0.06em; padding: 6px 10px; cursor: pointer;
  background: var(--surface); color: var(--muted); border: 0;
}
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--sea); color: var(--bg); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
label, .lbl { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 6px; }
.weight-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.num { display: flex; align-items: baseline; gap: 6px; }
input[type=number], input[type=datetime-local] {
  font-family: var(--font-mono); font-size: 1.2rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0;
}
input[type=number] { width: 7.5ch; }
input[type=datetime-local] { width: 100%; font-size: 1rem; }
.unit { color: var(--muted); font-family: var(--font-mono); }
input[type=range] { flex: 1 1 160px; min-width: 0; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button {
  font: inherit; font-weight: 600; padding: 10px 6px; border-radius: 8px; cursor: pointer;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line);
}
.seg button small { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.seg button[aria-pressed="true"] { background: var(--sea); color: var(--bg); border-color: var(--sea); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.seg.two-seg { grid-template-columns: 1fr 1fr; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.big { background: var(--sea-soft); border-radius: 10px; padding: 14px 12px; min-width: 0; }
.big .v { font-family: var(--font-mono); font-size: clamp(1.4rem, 6.5vw, 2rem); font-weight: 500; line-height: 1.1; }
.big .v span { font-size: 0.9rem; color: var(--muted); margin-left: 2px; }
.big.hot { background: var(--accent); color: var(--accent-fg); }
.big.hot .lbl, .big.hot .v span { color: inherit; opacity: 0.85; }
.big .lbl { margin-bottom: 4px; font-size: 0.7rem; }
.hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
td:last-child { text-align: right; font-family: var(--font-mono); font-size: 0.9rem; }
.tablewrap { overflow-x: auto; }
h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; }
ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.warn { border-left: 3px solid var(--accent); padding-left: 12px; }
@media (max-width: 420px) { .results { grid-template-columns: 1fr 1fr; } .big.hot { grid-column: 1 / -1; } }
</style>

<main>
  <header>
    <div>
      <h1 data-t="title">Calculateur Gravlax</h1>
      <p class="sub" data-t="sub">Sel, sucre et temps de salage sous vide selon le produit et son poids.</p>
    </div>
    <div class="lang" id="lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true" lang="fr">FR</button>
      <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
  </header>

  <section class="panel" id="params" aria-label="Paramètres">
    <div>
      <span class="lbl" data-t="product">Produit</span>
      <div class="seg two-seg" id="prod">
        <button type="button" data-prod="saumon" aria-pressed="true"></button>
        <button type="button" data-prod="magret" aria-pressed="false"></button>
        <button type="button" data-prod="filet" aria-pressed="false"></button>
        <button type="button" data-prod="poitrine" aria-pressed="false"></button>
      </div>
    </div>

    <div>
      <label for="w" id="wLbl">Poids du filet</label>
      <div class="weight-row">
        <div class="num"><input id="w" type="number" inputmode="numeric" min="200" max="4000" step="10" value="1000"><span class="unit">g</span></div>
        <input id="wr" type="range" min="200" max="3000" step="50" value="1000" aria-label="Poids en grammes">
      </div>
    </div>

    <div>
      <span class="lbl" data-t="texture">Texture souhaitée</span>
      <div class="seg" id="seg">
        <button type="button" data-p="doux" aria-pressed="false"><span></span><small></small></button>
        <button type="button" data-p="classique" aria-pressed="true"><span></span><small></small></button>
        <button type="button" data-p="ferme" aria-pressed="false"><span></span><small></small></button>
      </div>
    </div>

    <div class="two">
      <div><label for="ps" id="psL">Sel (% du poids)</label><div class="num"><input id="ps" type="number" min="1" max="10" step="0.5" value="5"><span class="unit">%</span></div></div>
      <div><label for="pu" data-t="sugarPct">Sucre (% du poids)</label><div class="num"><input id="pu" type="number" min="0" max="10" step="0.5" value="5"><span class="unit">%</span></div></div>
    </div>

    <div>
      <label for="start" data-t="start">Début du salage</label>
      <input id="start" type="datetime-local">
    </div>
  </section>

  <section class="results" id="results" aria-live="polite" aria-label="Résultats">
    <div class="big"><div class="lbl" id="rSelL">Sel fin</div><div class="v"><b id="rSel">50</b><span>g</span></div></div>
    <div class="big"><div class="lbl" data-t="sugar">Sucre semoule</div><div class="v"><b id="rSucre">50</b><span>g</span></div></div>
    <div class="big hot"><div class="lbl" data-t="time">Temps de salage</div><div class="v"><b id="rH">36</b><span>h</span></div></div>
  </section>

  <section class="panel">
    <h2 data-t="plan">Planning</h2>
    <div class="tablewrap"><table id="plan"></table></div>
    <p class="hint" id="dur"></p>
  </section>

  <section class="panel">
    <h2 data-t="arom">Pour aromatiser</h2>
    <p class="hint" id="saltHint"></p>
    <div class="tablewrap"><table id="arom"></table></div>
  </section>

  <section class="panel">
    <h2 data-t="method">Méthode</h2>
    <ol id="steps"></ol>
    <p class="hint warn" id="warn"></p>
  </section>
</main>

          "Frottez la poitrine sur toutes les faces, mettez-la sous vide dans un sac et placez-la au réfrigérateur (0 à 4 °C) pour la durée de salage indiquée. Massez le sac une fois par jour.",
          "Rincez, séchez soigneusement. Laissez à plat ou roulez la poitrine serrée, chair à l'intérieur, et ficelez. Enveloppez dans un linge propre ou une étamine.",
          "Laissez sécher au frais (réfrigérateur ou cave à 10-14 °C) jusqu'à la perte de poids indiquée. Pesez-la tous les 2 à 3 jours.",
          "Tranchez très finement, ou taillez en lardons à cuire. Se conserve ensuite 3 semaines au réfrigérateur, filmée."
        ]
      },
      en: {
        wLbl: "Pork belly weight", hint: PORK_HINT.en, arom: PORK_AROM.en, warn: PORK_WARN.en,
        steps: [
          "Keep the rind or remove it. Mix the curing salt, sugar, herbs, pepper and garlic.",
          "Rub the belly on all sides, vacuum-seal it in a bag and refrigerate (0 to 4 °C) for the curing time shown. Massage the bag once a day.",
          "Rinse and dry carefully. Leave it flat, or roll it tightly with the meat inside and tie with string. Wrap in a clean cloth or cheesecloth.",
          "Leave to dry somewhere cool (fridge, or cellar at 10-14 °C) until it reaches the weight loss shown. Weigh it every 2 to 3 days.",
          "Slice very thinly, or cut into lardons for cooking. It then keeps 3 weeks in the fridge, wrapped in cling film."
        ]
      }
    }
  };

  var product = "saumon";
  var P = PR.saumon;
  var profile = "classique";
  var $ = function (id) { return document.getElementById(id); };
  var w = $("w"), wr = $("wr"), ps = $("ps"), pu = $("pu"), st = $("start");

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function toLocalInput(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  var now = new Date(); now.setHours(now.getHours() + 1, 0, 0, 0);
  st.value = toLocalInput(now);

  function fmtDate(d) {
    return d.toLocaleString(UI[lang].locale, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function fmtDur(h) {
    var j = Math.floor(h / 24), r = h % 24, u = UI[lang].day;
    if (j === 0) return h + " h";
    return j + " " + u + (r ? " " + r + " h" : "");
  }

  /* Langue : ?lang=en|fr dans l'adresse, sinon le dernier choix, sinon celle du navigateur */
  function pickLang() {
    var q = (location.search.match(/[?&]lang=(fr|en)/) || [])[1];
    if (q) return q;
    try { var s = localStorage.getItem("gravlax-lang"); if (s === "fr" || s === "en") return s; } catch (e) {}
    return /^fr/i.test(navigator.language || "fr") ? "fr" : "en";
  }

  function renderStatic() {
    var U = UI[lang], T = P[lang];
    document.documentElement.lang = lang;
    document.title = U.title;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = U[el.getAttribute("data-t")]; });
    $("params").setAttribute("aria-label", U.params);
    $("results").setAttribute("aria-label", U.results);
    wr.setAttribute("aria-label", U.grams);
    document.querySelectorAll("#lang button").forEach(function (x) {
      x.setAttribute("aria-pressed", x.getAttribute("data-lang") === lang ? "true" : "false");
    });
    document.querySelectorAll("#prod button").forEach(function (x) {
      var p = U.prod[x.getAttribute("data-prod")];
      x.innerHTML = "";
      x.appendChild(document.createTextNode(p[0]));
      var s = document.createElement("small"); s.textContent = p[1]; x.appendChild(s);
    });
    $("wLbl").textContent = T.wLbl;
    $("rSelL").textContent = P.cure ? (lang === "fr" ? "Sel nitrité" : "Curing salt") : (lang === "fr" ? "Sel fin" : "Fine salt");
    $("psL").textContent = P.cure ? U.curePct : U.saltPct;
    $("saltHint").textContent = T.hint;
    $("warn").textContent = T.warn;
    $("steps").innerHTML = T.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("");
    document.querySelectorAll("#seg button").forEach(function (x) {
      var k = x.getAttribute("data-p"), p = P.prof[k];
      x.querySelector("span").textContent = U.prof[k];
      x.querySelector("small").textContent = pct(p[0]) + " / " + pct(p[1]);
    });
  }

  function calc() {
    var grams = parseFloat(w.value);
    if (!(grams > 0)) return;
    var U = UI[lang];
    var kg = grams / 1000;
    var salt = grams * (parseFloat(ps.value) || 0) / 100;
    var sugar = grams * (parseFloat(pu.value) || 0) / 100;
    var pf = P.prof[profile];
    /* sous vide : environ 20 % de temps en moins qu'un salage à sec classique */
    var hours = Math.round((P.time[0] + P.time[1] * kg) * pf[2] * 0.8);
    hours = Math.max(P.min, Math.min(P.max, hours));
    var dry = pf[3];

    $("rSel").textContent = Math.round(salt);
    $("rSucre").textContent = Math.round(sugar);
    $("rH").textContent = hours;

    var start = new Date(st.value);
    var rows = "";
    if (!isNaN(start)) {
      rows += "<tr><td>" + U.rowStart + "</td><td>" + fmtDate(start) + "</td></tr>";
      var endSalt = new Date(start.getTime() + hours * 3600000);
      if (P.dry) {
        rows += "<tr><td><b>" + U.rowDry + "</b></td><td><b>" + fmtDate(endSalt) + "</b></td></tr>";
        rows += "<tr><td><b>" + U.rowDryEnd(dry) + "</b></td><td><b>" + fmtDate(new Date(endSalt.getTime() + dry * 86400000)) + "</b></td></tr>";
      } else {
        rows += "<tr><td><b>" + U.rowSlice + "</b></td><td><b>" + fmtDate(endSalt) + "</b></td></tr>";
      }
    }
    $("plan").innerHTML = rows;
    $("dur").textContent = P.dry
      ? U.durDry(fmtDur(hours), dry, Math.round(grams * (1 - P.loss / 100)), P.loss, grams)
      : U.durTotal(fmtDur(hours), grams);

    $("arom").innerHTML = P[lang].arom(kg).map(function (r) {
      return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>";
    }).join("");
  }

  function syncWeight(v, from) {
    if (from !== "n") w.value = v;
    if (from !== "r") wr.value = Math.min(3000, Math.max(200, v));
    calc();
  }
  w.addEventListener("input", function () { var v = parseFloat(w.value); if (v > 0) syncWeight(v, "n"); });
  wr.addEventListener("input", function () { syncWeight(parseFloat(wr.value), "r"); });
  [ps, pu, st].forEach(function (el) { el.addEventListener("input", calc); });

  $("seg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    profile = b.getAttribute("data-p");
    document.querySelectorAll("#seg button").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    ps.value = P.prof[profile][0];
    pu.value = P.prof[profile][1];
    calc();
  });

  $("prod").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    product = b.getAttribute("data-prod");
    P = PR[product];
    document.querySelectorAll("#prod button").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    renderStatic();
    ps.value = P.prof[profile][0];
    pu.value = P.prof[profile][1];
    syncWeight(P.def);
  });

  $("lang").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    lang = b.getAttribute("data-lang");
    try { localStorage.setItem("gravlax-lang", lang); } catch (err) {}
    renderStatic();
    calc();
  });

  lang = pickLang();
  renderStatic();
  calc();
})();
</script>

</body></html>
